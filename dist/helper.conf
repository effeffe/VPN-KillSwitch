# /etc/vpnks/helper.conf - read by /usr/lib/vpnks/vpnks-helper (and by vpnks for display).
# Plain KEY=VALUE, never sourced. Must stay root-owned and not group/world-writable.

# network namespace the split-tunnel apps run in
NS=vpnks
# XFRM interface name of the split profile (its connection.interface-name, max 15 chars)
TUNNEL=vpnks0
# host-only veth pair: host side / namespace side and their addresses
HOST_IF=vpnks-h
NS_IF=vpnks-ns
HOST_ADDR=10.99.0.1/30
NS_ADDR=10.99.0.2/30
# resolvers used inside the namespace if the VPN pushes none (reached through the tunnel)
FALLBACK_DNS="1.1.1.1 9.9.9.9"
# leave a dummy named TUNNEL in the root namespace so NetworkManager keeps the VPN
# after an IKE re-establishment (see README)
PLACEHOLDER=yes
# interface kinds the helper will move
TUNNEL_KINDS=xfrm

# per-app method, switched from the vpnks window (vpnks-helper set-mode):
#   netns | cgroup-split | cgroup-killswitch
MODE=netns
# cgroup methods: system slice the apps run in, packet mark and routing table used
# to send their traffic through the namespace into the tunnel (cgroup-split)
SLICE=vpnks.slice
CGROUP_MARK=0x766b
CGROUP_TABLE=211
